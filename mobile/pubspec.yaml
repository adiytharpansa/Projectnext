name: anilab
description: Anilab — klien mobile Flutter untuk Projectnext API (streaming & unduh anime).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & navigasi
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Jaringan & media
  dio: ^5.4.3
  cached_network_image: ^3.3.1
  video_player: ^2.9.1
  wakelock_plus: ^1.2.5

  # Penyimpanan lokal & utilitas
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
